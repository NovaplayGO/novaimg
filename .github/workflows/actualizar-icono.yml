name: Actualizar Icono Individual

on:
  workflow_dispatch:
    inputs:
      canal:
        description: 'Nombre del archivo webp (ej: 006.webp)'
        required: true
        type: string
      imagen_url:
        description: 'URL de la imagen (Directa o Base64)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  actualizar-icono:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pillow requests

      - name: Validar archivo del icono
        run: |
          ARCHIVO="${{ github.event.inputs.canal }}"
          echo "Archivo solicitado: $ARCHIVO"
          if [[ ! "$ARCHIVO" =~ ^[a-zA-Z0-9_-]+\.webp$ ]]; then
            echo "Nombre de archivo inválido"
            exit 1
          fi

      - name: Descargar y Convertir Imagen
        run: |
          python - <<'PY'
          import os
          import requests
          import base64
          from PIL import Image
          from io import BytesIO

          url = """${{ github.event.inputs.imagen_url }}""".strip()
          canal = """${{ github.event.inputs.canal }}""".strip()
          salida = os.path.join("icons", canal)
          
          print(f"Procesando canal: {canal}")
          
          try:
              if url.startswith("data:image"):
                  header, encoded = url.split(",", 1)
                  image_data = base64.b64decode(encoded)
              else:
                  headers = {"User-Agent": "Mozilla/5.0"}
                  response = requests.get(url, headers=headers, timeout=30)
                  response.raise_for_status()
                  image_data = response.content

              os.makedirs("icons", exist_ok=True)
              img = Image.open(BytesIO(image_data)).convert("RGBA")
              
              # Redimensionar opcional si es muy grande manteniendo aspecto (max 512x512)
              img.thumbnail((512, 512), Image.Resampling.LANCZOS)
              
              img.save(salida, "WEBP", quality=85)
              print(f"Imagen convertida y guardada exitosamente en {salida}")
          except Exception as e:
              print(f"Error procesando imagen: {e}")
              exit(1)
          PY

      - name: Verificar archivo generado
        run: |
          ARCHIVO="${{ github.event.inputs.canal }}"
          echo "Archivo generado:"
          ls -lh "icons/$ARCHIVO"
          file "icons/$ARCHIVO"

      - name: Guardar cambios
        run: |
          ARCHIVO="${{ github.event.inputs.canal }}"
          git config user.name "NovaImg Bot"
          git config user.email "novaimg-bot@users.noreply.github.com"
          git add "icons/$ARCHIVO"
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
            exit 0
          fi
          git commit -m "Actualizar icono $ARCHIVO [skip ci]"
          git pull --rebase origin main
          git push origin main
